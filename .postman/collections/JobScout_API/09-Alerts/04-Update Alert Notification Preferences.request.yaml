$kind: request
name: Update Alert Notification Preferences
description: Update Alert Notification Preferences
method: PUT
url: '{{baseUrl}}/api/alerts/settings'
header:
  - key: Content-Type
    value: application/json
    type: text
    disabled: false
body:
  mode: raw
  raw: |-
    {
      "whatsappEnabled": true,
      "whatsappTargetPhone": "9876543210",
      "telegramEnabled": true,
      "telegramChatId": "987654321"
    }
  options:
    raw:
      language: json
event:
  - listen: test
    script:
      type: text/javascript
      exec:
        - pm.test('Response time is acceptable (< 1500ms)', function () {
        - '    pm.expect(pm.response.responseTime).to.be.below(1500);'
        - '});'
        - pm.test('Status code is successful', function () {
        - '    pm.expect(pm.response.code).to.be.below(400);'
        - '});'
scripts:
  test: |-
    pm.test('Response time is acceptable (< 1500ms)', function () {
        pm.expect(pm.response.responseTime).to.be.below(1500);
    });
    pm.test('Status code is successful', function () {
        pm.expect(pm.response.code).to.be.below(400);
    });
