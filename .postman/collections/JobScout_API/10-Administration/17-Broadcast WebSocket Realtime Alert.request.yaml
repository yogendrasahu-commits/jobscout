$kind: request
name: Broadcast WebSocket Realtime Alert
description: Broadcast WebSocket Realtime Alert
method: POST
url: '{{baseUrl}}/api/admin/broadcast'
header:
  - key: Content-Type
    value: application/json
    type: text
    disabled: false
  - key: Authorization
    value: Bearer {{token}}
    type: text
    disabled: false
body:
  mode: raw
  raw: |-
    {
      "title": "Grid Update",
      "message": "Real-time updates scheduled tonight.",
      "type": "info"
    }
  options:
    raw:
      language: json
event:
  - listen: test
    script:
      type: text/javascript
      exec:
        - pm.test('Response time is acceptable (< 1500ms)', function () {
        - '    pm.expect(pm.response.responseTime).to.be.below(1500);'
        - '});'
        - pm.test('Status code is successful', function () {
        - '    pm.expect(pm.response.code).to.be.below(400);'
        - '});'
scripts:
  test: |-
    pm.test('Response time is acceptable (< 1500ms)', function () {
        pm.expect(pm.response.responseTime).to.be.below(1500);
    });
    pm.test('Status code is successful', function () {
        pm.expect(pm.response.code).to.be.below(400);
    });
