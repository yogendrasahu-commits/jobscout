$kind: request
name: Send Connection Request or Toggle Connect
description: Send Connection Request or Toggle Connect
method: POST
url: '{{baseUrl}}/api/network/connect'
header:
  - key: Content-Type
    value: application/json
    type: text
    disabled: false
body:
  mode: raw
  raw: |-
    {
      "targetUserId": "usr_seeker_1"
    }
  options:
    raw:
      language: json
event:
  - listen: test
    script:
      type: text/javascript
      exec:
        - pm.test('Response time is acceptable (< 1500ms)', function () {
        - '    pm.expect(pm.response.responseTime).to.be.below(1500);'
        - '});'
        - pm.test('Status code is successful', function () {
        - '    pm.expect(pm.response.code).to.be.below(400);'
        - '});'
scripts:
  test: |-
    pm.test('Response time is acceptable (< 1500ms)', function () {
        pm.expect(pm.response.responseTime).to.be.below(1500);
    });
    pm.test('Status code is successful', function () {
        pm.expect(pm.response.code).to.be.below(400);
    });
