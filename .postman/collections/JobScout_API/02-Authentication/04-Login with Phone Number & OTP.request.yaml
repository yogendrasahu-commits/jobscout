$kind: request
name: Login with Phone Number & OTP
description: Login with Phone Number & OTP
method: POST
url: '{{baseUrl}}/api/auth/login-phone-otp'
header:
  - key: Content-Type
    value: application/json
    type: text
    disabled: false
body:
  mode: raw
  raw: |-
    {
      "phone": "9876543210",
      "otp": "123456"
    }
  options:
    raw:
      language: json
event:
  - listen: test
    script:
      type: text/javascript
      exec:
        - if (pm.response.code === 200 || pm.response.code === 201) {
        - '    var jsonData = pm.response.json();'
        - '    if (jsonData.token) {'
        - '        pm.collectionVariables.set(''token'', jsonData.token);'
        - '        console.log(''✅ JWT Token automatically saved to collection variable {{token}}'');'
        - '    }'
        - '}'
        - pm.test('Status code is 200 or 201', function () {
        - '    pm.expect(pm.response.code).to.be.oneOf([200, 201]);'
        - '});'
scripts:
  test: |-
    if (pm.response.code === 200 || pm.response.code === 201) {
        var jsonData = pm.response.json();
        if (jsonData.token) {
            pm.collectionVariables.set('token', jsonData.token);
            console.log('✅ JWT Token automatically saved to collection variable {{token}}');
        }
    }
    pm.test('Status code is 200 or 201', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 201]);
    });
