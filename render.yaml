services:
  - type: web
    name: jobscout-live
    runtime: node
    plan: free
    region: singapore # Closest low-latency region to India
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
