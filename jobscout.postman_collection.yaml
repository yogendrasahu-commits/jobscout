$kind: collection
info:
  _postman_id: c210718e-b54c-42c3-94eb-jobscout-api
  name: JobScout & JobRadar API Testing Collection
  description: Complete automated Postman collection for testing all endpoints in JobScout with environment variable support (`{{baseUrl}}`, `{{token}}`), pre-request scripts, and automatic JWT token extraction.
  schema: https://schema.getpostman.com/json/collection/v2.1.0/collection.json
variable:
  - key: baseUrl
    value: http://localhost:5000
    type: string
  - key: token
    value: ''
    type: string
  - key: testPhone
    value: '9876543210'
    type: string
  - key: testOtp
    value: '123456'
    type: string
  - key: testPassword
    value: password123
    type: string
item:
  - name: System
    description: Health checks, root metadata and server uptime
    item:
      - name: API Overview and Available Endpoints
        request:
          method: GET
          header:
            - key: Content-Type
              value: application/json
          url:
            raw: '{{baseUrl}}/api'
            host:
              - '{{baseUrl}}'
            path:
              - api
          description: Returns general service status, version info, and endpoint index.
        response: []
        event:
          - listen: test
            script:
              type: text/javascript
              exec:
                - pm.test('Response time is acceptable (< 1500ms)', function () {
                - '    pm.expect(pm.response.responseTime).to.be.below(1500);'
                - '});'
                - pm.test('Status code is successful', function () {
                - '    pm.expect(pm.response.code).to.be.below(400);'
                - '});'
      - name: System Health & Uptime
        request:
          method: GET
          header:
            - key: Content-Type
              value: application/json
          url:
            raw: '{{baseUrl}}/api/health'
            host:
              - '{{baseUrl}}'
            path:
              - api
              - health
          description: Returns server uptime, timestamp, and health status.
        response: []
        event:
          - listen: test
            script:
              type: text/javascript
              exec:
                - pm.test('Response time is acceptable (< 1500ms)', function () {
                - '    pm.expect(pm.response.responseTime).to.be.below(1500);'
                - '});'
                - pm.test('Status code is successful', function () {
                - '    pm.expect(pm.response.code).to.be.below(400);'
                - '});'
