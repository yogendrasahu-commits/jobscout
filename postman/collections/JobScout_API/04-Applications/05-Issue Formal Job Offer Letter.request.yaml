$kind: request
name: Issue Formal Job Offer Letter
description: Issue Formal Job Offer Letter
method: POST
url: '{{baseUrl}}/api/applications/issue-offer'
header:
  - key: Content-Type
    value: application/json
    type: text
    disabled: false
  - key: Authorization
    value: Bearer {{token}}
    type: text
    disabled: false
body:
  mode: raw
  raw: |-
    {
      "applicationId": "app_101",
      "salary": "₹22,00,000 / annum",
      "joiningDate": "2026-12-01",
      "notes": "Includes annual performance bonus & health coverage."
    }
  options:
    raw:
      language: json
event:
  - listen: test
    script:
      type: text/javascript
      exec:
        - pm.test('Response time is acceptable (< 1500ms)', function () {
        - '    pm.expect(pm.response.responseTime).to.be.below(1500);'
        - '});'
        - pm.test('Status code is successful', function () {
        - '    pm.expect(pm.response.code).to.be.below(400);'
        - '});'
scripts:
  test: |-
    pm.test('Response time is acceptable (< 1500ms)', function () {
        pm.expect(pm.response.responseTime).to.be.below(1500);
    });
    pm.test('Status code is successful', function () {
        pm.expect(pm.response.code).to.be.below(400);
    });
