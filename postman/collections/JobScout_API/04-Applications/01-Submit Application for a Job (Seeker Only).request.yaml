$kind: request
name: Submit Application for a Job (Seeker Only)
description: Submit Application for a Job (Seeker Only)
method: POST
url: '{{baseUrl}}/api/applications'
header:
  - key: Content-Type
    value: application/json
    type: text
    disabled: false
  - key: Authorization
    value: Bearer {{token}}
    type: text
    disabled: false
body:
  mode: raw
  raw: |-
    {
      "jobId": "job_1",
      "pitch": "I have 5 years building WebRTC platforms and would love to join your team!",
      "resumeUrl": "https://example.com/resume.pdf"
    }
  options:
    raw:
      language: json
event:
  - listen: test
    script:
      type: text/javascript
      exec:
        - pm.test('Response time is acceptable (< 1500ms)', function () {
        - '    pm.expect(pm.response.responseTime).to.be.below(1500);'
        - '});'
        - pm.test('Status code is successful', function () {
        - '    pm.expect(pm.response.code).to.be.below(400);'
        - '});'
scripts:
  test: |-
    pm.test('Response time is acceptable (< 1500ms)', function () {
        pm.expect(pm.response.responseTime).to.be.below(1500);
    });
    pm.test('Status code is successful', function () {
        pm.expect(pm.response.code).to.be.below(400);
    });
