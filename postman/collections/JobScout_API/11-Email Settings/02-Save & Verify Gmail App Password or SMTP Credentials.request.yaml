$kind: request
name: Save & Verify Gmail App Password or SMTP Credentials
description: Save & Verify Gmail App Password or SMTP Credentials
method: POST
url: '{{baseUrl}}/api/settings/email'
header:
  - key: Content-Type
    value: application/json
    type: text
    disabled: false
  - key: Authorization
    value: Bearer {{token}}
    type: text
    disabled: false
body:
  mode: raw
  raw: |-
    {
      "gmailUser": "yourname@gmail.com",
      "gmailPass": "abcd efgh ijkl mnop",
      "smtpHost": "",
      "smtpPort": "",
      "smtpUser": "",
      "smtpPass": "",
      "emailFrom": "JobScout Talent <yourname@gmail.com>"
    }
  options:
    raw:
      language: json
event:
  - listen: test
    script:
      type: text/javascript
      exec:
        - pm.test('Response time is acceptable (< 1500ms)', function () {
        - '    pm.expect(pm.response.responseTime).to.be.below(1500);'
        - '});'
        - pm.test('Status code is successful', function () {
        - '    pm.expect(pm.response.code).to.be.below(400);'
        - '});'
scripts:
  test: |-
    pm.test('Response time is acceptable (< 1500ms)', function () {
        pm.expect(pm.response.responseTime).to.be.below(1500);
    });
    pm.test('Status code is successful', function () {
        pm.expect(pm.response.code).to.be.below(400);
    });
