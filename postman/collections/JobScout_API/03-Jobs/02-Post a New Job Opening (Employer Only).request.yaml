$kind: request
name: Post a New Job Opening (Employer Only)
description: Post a New Job Opening (Employer Only)
method: POST
url: '{{baseUrl}}/api/jobs'
header:
  - key: Content-Type
    value: application/json
    type: text
    disabled: false
  - key: Authorization
    value: Bearer {{token}}
    type: text
    disabled: false
body:
  mode: raw
  raw: |-
    {
      "title": "Fullstack Node & React Developer",
      "company": "TechPulse Solutions",
      "category": "Technology",
      "jobType": "Full-time",
      "salary": "₹15,00,000 - ₹20,00,000 / yr",
      "lat": 19.076,
      "lng": 72.8777,
      "address": "BKC, Mumbai",
      "description": "Lead fullstack development of our live radar maps.",
      "skills": [
        "React",
        "Node.js",
        "MongoDB"
      ],
      "urgent": true
    }
  options:
    raw:
      language: json
event:
  - listen: test
    script:
      type: text/javascript
      exec:
        - pm.test('Response time is acceptable (< 1500ms)', function () {
        - '    pm.expect(pm.response.responseTime).to.be.below(1500);'
        - '});'
        - pm.test('Status code is successful', function () {
        - '    pm.expect(pm.response.code).to.be.below(400);'
        - '});'
scripts:
  test: |-
    pm.test('Response time is acceptable (< 1500ms)', function () {
        pm.expect(pm.response.responseTime).to.be.below(1500);
    });
    pm.test('Status code is successful', function () {
        pm.expect(pm.response.code).to.be.below(400);
    });
